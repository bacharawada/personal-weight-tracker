# ============================================================
# Weight Tracker — login theme messages (English)
#
# Only the strings this theme adds on top of the stock Keycloak bundles;
# everything else (labels, errors, doLogIn, backToLogin…) is inherited
# from parent=keycloak, which already ships en and fr.
#
# Same authoring rules as the email bundles: no HTML metacharacters
# (& < >) and no ASCII apostrophe (') — values pass through
# java.text.MessageFormat, which treats it as an escape character.
# ============================================================

