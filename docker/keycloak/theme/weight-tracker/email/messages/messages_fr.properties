wtPasswordResetTitle=Réinitialiser votre mot de passe
wtPasswordResetPreheader=Choisissez un nouveau mot de passe pour votre compte Weight Tracker.
wtPasswordResetIntro=Une réinitialisation du mot de passe de ce compte Weight Tracker vient d’être demandée. Si cette demande vient de vous, choisissez un nouveau mot de passe ci-dessous.
wtPasswordResetCta=Choisir un nouveau mot de passe
wtPasswordResetIgnore=Si cette demande ne vient pas de vous, ignorez ce message : votre mot de passe reste inchangé.

# ---- Vérification de l’adresse e-mail ----------------------
