# ============================================================
# Weight Tracker — email theme messages (French)
#
# Same two rules as messages_en.properties: no HTML metacharacters
# (& < >), and never the ASCII apostrophe (') — java.text.MessageFormat
# treats it as an escape character. French copy therefore uses the
# typographic apostrophe U+2019 throughout, which MessageFormat ignores.
#
# File is UTF-8; accented characters are literal, no \uXXXX escapes.
# ============================================================

# ---- Sujets ------------------------------------------------
passwordResetSubject=Réinitialisation de votre mot de passe Weight Tracker
emailVerificationSubject=Confirmez votre adresse e-mail Weight Tracker
executeActionsSubject=Action requise sur votre compte Weight Tracker

# ---- Commun à tous les templates ---------------------------
wtGreeting=Bonjour {0},
wtGreetingNoName=Bonjour,
wtLinkExpiry=Ce lien expire dans {0}.
wtLinkFallback=Le bouton ne fonctionne pas ? Copiez cette adresse dans votre navigateur :
wtEmailFooter=Message automatique de Weight Tracker. Merci de ne pas y répondre.

