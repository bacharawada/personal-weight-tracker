wtEmailVerificationCta=Confirmer mon adresse
wtEmailVerificationIgnore=Si vous n’êtes pas à l’origine de cette inscription, ignorez ce message : aucun compte ne sera activé.

# ---- Actions requises déclenchées par un administrateur ----
