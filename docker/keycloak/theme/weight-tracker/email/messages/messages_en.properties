# ============================================================
# Weight Tracker — email theme messages (English)
#
# Read as UTF-8 by Keycloak 24 (it falls back to ISO-8859-1 only if the
# bytes are not valid UTF-8), so accented characters go in literally.
#
# Two rules for every value here:
#   - No HTML metacharacters (& < >). Keycloak renders .ftl email
#     templates without auto-escaping, so values are emitted verbatim.
#   - No ASCII apostrophe ('). Every message goes through
#     java.text.MessageFormat, where a lone quote is an escape character
#     and would swallow the surrounding text. Use the typographic
#     apostrophe (U+2019) instead — MessageFormat ignores it.
#
# The *Subject keys are resolved by Keycloak itself (their names are
# fixed); everything prefixed wt* is ours and referenced from the
# templates.
# ============================================================

# ---- Subjects ----------------------------------------------
passwordResetSubject=Reset your Weight Tracker password
emailVerificationSubject=Confirm your Weight Tracker email address
executeActionsSubject=Action required on your Weight Tracker account

# ---- Shared across templates -------------------------------
wtGreeting=Hi {0},
wtGreetingNoName=Hi,
wtLinkExpiry=This link expires in {0}.
wtLinkFallback=Button not working? Copy this address into your browser:
wtEmailFooter=Automated message from Weight Tracker. Please do not reply.

# ---- Password reset ----------------------------------------
wtPasswordResetTitle=Reset your password
wtPasswordResetPreheader=Choose a new password for your Weight Tracker account.
wtPasswordResetIntro=Someone just asked to reset the password of this Weight Tracker account. If that was you, choose a new one below.
wtPasswordResetCta=Choose a new password
wtPasswordResetIgnore=If this request did not come from you, ignore this email: your password stays unchanged.

# ---- Email verification ------------------------------------
wtEmailVerificationTitle=Confirm your email address
wtEmailVerificationPreheader=One click to activate your Weight Tracker account.
wtEmailVerificationIntro=Welcome. Confirm this email address to activate your Weight Tracker account.
wtEmailVerificationCta=Confirm my address
wtEmailVerificationIgnore=If you did not sign up for Weight Tracker, ignore this email: no account will be activated.

# ---- Admin-triggered required actions ----------------------
wtExecuteActionsTitle=Your account needs an update
wtExecuteActionsPreheader=An action is required on your Weight Tracker account.
wtExecuteActionsIntro=An administrator is asking you to complete the following on your Weight Tracker account:
wtExecuteActionsCta=Continue
wtExecuteActionsIgnore=If this email is unexpected, ignore it: nothing changes until the link is opened.

# ---- Required-action labels (executeActions) ---------------
requiredAction.CONFIGURE_TOTP=Set up two-factor authentication
requiredAction.UPDATE_PASSWORD=Update your password
requiredAction.UPDATE_PROFILE=Update your profile
requiredAction.VERIFY_EMAIL=Verify your email address
requiredAction.CONFIGURE_RECOVERY_AUTHN_CODES=Generate recovery codes
requiredAction.TERMS_AND_CONDITIONS=Accept the terms and conditions
requiredAction.terms_and_conditions=Accept the terms and conditions
requiredAction.webauthn-register=Register a security key
requiredAction.webauthn-register-passwordless=Register a passwordless security key
requiredAction.update_user_locale=Choose your language
requiredAction.delete_account=Delete your account

# ---- Link-expiry units -------------------------------------
# Rendered by linkExpirationFormatter as "<value> <unit>". The .1
# variants are the singular forms.
linkExpirationFormatter.timePeriodUnit.seconds=seconds
linkExpirationFormatter.timePeriodUnit.seconds.1=second
linkExpirationFormatter.timePeriodUnit.minutes=minutes
linkExpirationFormatter.timePeriodUnit.minutes.1=minute
linkExpirationFormatter.timePeriodUnit.hours=hours
linkExpirationFormatter.timePeriodUnit.hours.1=hour
linkExpirationFormatter.timePeriodUnit.days=days
linkExpirationFormatter.timePeriodUnit.days.1=day
